[pytest]
asyncio_mode = auto
testpaths = tests
# This is the Stretch (auth) branch. The Lab's tests/backend suite asserts
# /extract is open (200 without credentials), which is the opposite of the
# auth contract here (401 without credentials) — the two suites are mutually
# exclusive by design and run on separate branches. Ignore tests/backend so a
# bare `pytest` on this branch runs only the suite that belongs to it. The
# stretch autograder invokes `pytest tests/auth` explicitly, so it is unaffected.
addopts = -p no:warnings --ignore=tests/backend
filterwarnings =
    ignore
